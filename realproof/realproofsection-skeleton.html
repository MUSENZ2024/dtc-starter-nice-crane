<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MUSE — Real Proof Section Skeleton</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #F4F2ED; font-family: system-ui, -apple-system, sans-serif; }

    .proof-strip {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      /* Left padding so first card lines up with section header */
      padding-left: 18px;
      /* Right padding so last card doesn't flush against edge */
      padding-right: 18px;
      /* Hide scrollbar */
      scrollbar-width: none;
    }
    .proof-strip::-webkit-scrollbar { display: none; }

    .proof-card {
      scroll-snap-align: start;
      flex-shrink: 0;
      /* Mobile: 3 cards visible + 4th peeking.
         Width = (100vw - left-pad - 2×gap) / 3.15
         On 390px: ≈ 112px each → 3 cards + ~28px of 4th visible */
      width: calc((100vw - 18px - 24px) / 3.15);
      aspect-ratio: 9 / 16;
      border-radius: 18px;
      overflow: hidden;
      background: #0A0A0A;
      position: relative;
    }

    /* Desktop: fixed comfortable width, all 9 visible in a single scrollable row */
    @media (min-width: 640px) {
      .proof-strip {
        padding-left: 32px;
        padding-right: 32px;
        gap: 14px;
      }
      .proof-card {
        width: 220px;
        border-radius: 22px;
      }
    }

    @media (min-width: 1024px) {
      .proof-card { width: 260px; }
    }

    .proof-card img,
    .proof-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
  </style>
</head>
<body class="text-[#0A0A0A]">

<!-- ============================================================
