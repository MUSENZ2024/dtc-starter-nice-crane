name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${{ secrets.MEDUSA_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${{ secrets.MEDUSA_BACKEND_URL }}
      NEXT_PUBLIC_DEFAULT_REGION: nz
      NEXT_PUBLIC_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Run security audit
        run: |
          set +e
          pnpm audit --prod --audit-level critical 2>&1 | tee /tmp/pnpm-audit.log
          audit_status=${PIPESTATUS[0]}
          set -e

          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi

          if grep -q "ERR_PNPM_AUDIT_BAD_RESPONSE" /tmp/pnpm-audit.log && grep -q "410" /tmp/pnpm-audit.log; then
            echo "::warning::pnpm audit endpoint returned 410 Gone; typecheck, tests, and build completed successfully."
            exit 0
          fi

          exit "$audit_status"
